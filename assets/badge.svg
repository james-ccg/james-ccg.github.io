<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31" shape-rendering="crispEdges" role="img" aria-label="james-ccg">
	<!-- Classic 88x31 web button. Authored at exact pixel size with crisp
	     edges so it stays sharp wherever it is hotlinked. -->
	<rect width="88" height="31" fill="#14151c"/>

	<!-- left mark block -->
	<rect x="0" y="0" width="28" height="31" fill="#ffb454"/>
	<g fill="#14151c">
		<!-- pixel "J" -->
		<rect x="10" y="7"  width="12" height="3"/>
		<rect x="15" y="10" width="3"  height="9"/>
		<rect x="12" y="19" width="3"  height="3"/>
		<rect x="9"  y="16" width="3"  height="4"/>
	</g>

	<!-- scanline texture over the mark -->
	<g fill="#14151c" fill-opacity="0.13">
		<rect x="0" y="1"  width="28" height="1"/>
		<rect x="0" y="5"  width="28" height="1"/>
		<rect x="0" y="9"  width="28" height="1"/>
		<rect x="0" y="13" width="28" height="1"/>
		<rect x="0" y="17" width="28" height="1"/>
		<rect x="0" y="21" width="28" height="1"/>
		<rect x="0" y="25" width="28" height="1"/>
		<rect x="0" y="29" width="28" height="1"/>
	</g>

	<!-- wordmark, drawn as pixels so no font has to load -->
	<g fill="#dfe1ea">
		<!-- j -->
		<rect x="34" y="9"  width="2" height="2"/>
		<rect x="34" y="13" width="2" height="7"/>
		<rect x="32" y="18" width="2" height="2"/>
		<!-- a -->
		<rect x="38" y="13" width="6" height="2"/>
		<rect x="42" y="15" width="2" height="5"/>
		<rect x="38" y="16" width="4" height="2"/>
		<rect x="38" y="18" width="2" height="2"/>
		<!-- m -->
		<rect x="46" y="13" width="2" height="7"/>
		<rect x="48" y="13" width="2" height="2"/>
		<rect x="50" y="13" width="2" height="7"/>
		<rect x="52" y="13" width="2" height="2"/>
		<rect x="54" y="13" width="2" height="7"/>
		<!-- e -->
		<rect x="58" y="13" width="6" height="2"/>
		<rect x="58" y="15" width="2" height="3"/>
		<rect x="60" y="16" width="4" height="1"/>
		<rect x="58" y="18" width="6" height="2"/>
		<!-- s -->
		<rect x="66" y="13" width="6" height="2"/>
		<rect x="66" y="15" width="2" height="1"/>
		<rect x="66" y="16" width="6" height="1"/>
		<rect x="70" y="17" width="2" height="1"/>
		<rect x="66" y="18" width="6" height="2"/>
	</g>

	<!-- accent tail: "-ccg" -->
	<g fill="#ffb454">
		<rect x="74" y="16" width="3" height="2"/>
		<rect x="79" y="13" width="6" height="2"/>
		<rect x="79" y="15" width="2" height="3"/>
		<rect x="79" y="18" width="6" height="2"/>
	</g>

	<!-- inner bevel -->
	<rect x="0" y="0" width="88" height="1" fill="#ffffff" fill-opacity="0.22"/>
	<rect x="0" y="0" width="1" height="31" fill="#ffffff" fill-opacity="0.14"/>
	<rect x="0" y="30" width="88" height="1" fill="#000000" fill-opacity="0.5"/>
	<rect x="87" y="0" width="1" height="31" fill="#000000" fill-opacity="0.5"/>
</svg>
